<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.ico" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number9</title>

    <!-- ═══════════════════════════════════════════════════════
         FONT PRELOADS — Grift (all weights used on the site)
         Preloading fonts eliminates FOUT (flash of unstyled text)
         and prevents layout shifts during initial render.
    ═══════════════════════════════════════════════════════ -->
    <link rel="preload" as="font" href="/src/fonts/grift-medium.ttf"   type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" as="font" href="/src/fonts/grift-semibold.ttf" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" as="font" href="/src/fonts/grift-light.ttf"    type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" as="font" href="/src/fonts/grift-regular.ttf"  type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" as="font" href="/src/fonts/grift-black.ttf"    type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" as="font" href="/src/fonts/grift-extrabold.ttf" type="font/ttf" crossorigin="anonymous" />



    <!-- ═══════════════════════════════════════════════════════
         THEME INITIALIZATION — Prevents FOUC (flash of white)
    ═══════════════════════════════════════════════════════ -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
